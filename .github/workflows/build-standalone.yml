name: Build standalone bundle

# Build on Linux, ship a single archive, never build on the production server.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-standalone.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-standalone
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Assemble standalone bundle
        working-directory: web
        run: |
          test -f .next/standalone/server.js
          # taibu-core uses createRequire(import.meta.url); nft may miss those deps
          node scripts/complete-standalone-deps.cjs
          mkdir -p .next/standalone/public .next/standalone/.next/static
          cp -r public/. .next/standalone/public/
          cp -r .next/static/. .next/standalone/.next/static/
          tar czf "$GITHUB_WORKSPACE/icu-standalone.tar.gz" -C .next/standalone .
          ls -lh "$GITHUB_WORKSPACE/icu-standalone.tar.gz"

      - name: Upload artifact (manual download)
        uses: actions/upload-artifact@v4
        with:
          name: icu-standalone
          path: icu-standalone.tar.gz
          retention-days: 7

      - name: Publish fixed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete standalone-latest --yes --cleanup-tag || true
          gh release create standalone-latest "$GITHUB_WORKSPACE/icu-standalone.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "Standalone $GITHUB_SHA" \
            --notes "Auto-built from $GITHUB_SHA. Asset: icu-standalone.tar.gz"
